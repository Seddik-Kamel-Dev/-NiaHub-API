<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Jam Sessions</title>
</head>
    <body>
        <h1>🎸 Jam Sessions</h1>
        <ul id="list"></ul>

        <script>fetch("https://localhost:7276/api/JamSessionAds")
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("list");

            data.forEach(ad => {
                const li = document.createElement("li");

                console.log(ad);

                li.innerHTML = `
                    <strong>${ad.title}</strong><br/>
                    ${ad.shortDescription ?? ""}<br/>
                   Description :  ${ad.detailedDesciption && ad.detailedDesciption.trim() !== "" 
                            ? ad.detailedDesciption 
                            : "non renseignée"}<br/>

                    📍 ${ad.city ?? "Non renseigné"} - ${ad.venueName ?? ""}<br/>

                    🎵 ${ad.styles?.join(", ") ?? "Non précisé"}<br/>

                    🎹 Instruments recherchés : ${ad.instrumentsNeeded?.join(", ") ?? "Non précisé"}<br/>

                    🎧 Matériels présents : ${
                            ad.equipmentProvided?.length
                                                    ? ad.equipmentProvided.join(", ")
                                                    : "Non renseigné"
                        }<br/>
                    🎯 Niveau : ${ad.minimumLevel ?? "Non précisé"}<br/>

                    🕒 ${ad.recurrence ?? ""} à ${formatTime(ad.startTime)} (${ad.durationMinutes ?? 0} min)<br/>

                    👤 ${ad.creatorUsername ?? "Anonyme"}<br/>
                    
                    👤👤 Max participation: ${ad.maxParticipants}


                    <hr/>
                `;

                list.appendChild(li);
            });
        })
        .catch(err => console.error("Erreur API :", err));

        function formatTime(time) {
            if (!time) return "";

            // Si format "HH:mm:ss"
            const parts = time.split(":");
            return `${parts[0]}h${parts[1]}`;
}
        </script>
    </body>
</html>
